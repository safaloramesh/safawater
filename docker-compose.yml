version: '3.8'

services:
  safa-water:
    build:
      context: .
      args:
        - API_KEY=${API_KEY}
    container_name: safa_water_system
    ports:
      - "8080:80"
    environment:
      - API_KEY=${API_KEY}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
